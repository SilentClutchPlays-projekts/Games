<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My-Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #38bdf8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #menu {
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-btn {
      background-color: #0a0a0a;
      color: #38bdf8;
      border: 2px solid #1e3a8a;
      padding: 18px 25px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .game-btn:hover {
      background-color: #1e3a8a;
      color: #ffffff;
      border-color: #38bdf8;
      transform: scale(1.02);
    }

    #game-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #back-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background-color: rgba(0, 0, 0, 0.7);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    #back-btn:hover {
      opacity: 1;
      background-color: #1e3a8a;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>Choose Ur Game</h1>
    <div class="game-list" id="game-list"></div>
  </div>

  <div id="game-container">
    <button id="back-btn" onclick="closeGame()">← Menüü</button>
    <iframe id="game-frame" allowfullscreen></iframe>
  </div>

  <script>
    const gameFiles = [
      "a_Minceraft.html",
      "a_Halloween.html",
      "a_BackRooms.html",
      "a_SamsungS26ProMax.html",
      "a_CoolGame.html",
      "a_Iphone(ios26).html"
    ];

    const gameListEl = document.getElementById("game-list");
    const menuEl = document.getElementById("menu");
    const gameContainerEl = document.getElementById("game-container");
    const gameFrameEl = document.getElementById("game-frame");

    gameFiles.forEach(file => {
      const cleanName = file.replace(/\.html$/i, "");
      const btn = document.createElement("button");
      btn.className = "game-btn";
      btn.textContent = cleanName;
      btn.onclick = () => openGame(file);
      gameListEl.appendChild(btn);
    });

    function openGame(fileName) {
      menuEl.style.display = "none";
      gameContainerEl.style.display = "block";
      gameFrameEl.src = "games/" + encodeURIComponent(fileName);
    }

    function closeGame() {
      gameFrameEl.src = "";
      gameContainerEl.style.display = "none";
      menuEl.style.display = "block";
    }
  </script>

</body>
</html>
